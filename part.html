<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery Part · Untessellator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 28 10v12L16 29 4 22V10z' fill='%232f9e94'/%3E%3Cpath d='M16 3 28 10 16 17 4 10z' fill='%239aa9bf'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "fflate": "https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js"
    }
  }
  </script>
</head>
<body>
  <header class="top">
    <a class="brand" href="./">Untessellator <span>Gallery</span></a>
    <nav>
      <a href="https://h0witzer.github.io/Untessellator/">Open the studio</a>
      <a href="https://github.com/h0witzer/Untessellator">GitHub</a>
    </nav>
  </header>

  <main class="part">
    <div class="stage" id="stage">
      <canvas id="view" aria-label="3D view of the exported STEP, faces coloured by surface type"></canvas>
      <div class="status" id="status">Loading…</div>
      <div class="tools">
        <button id="fit">Fit</button>
        <button id="edges" aria-pressed="true">Edges</button>
        <button id="mesh" aria-pressed="false">Input triangles</button>
      </div>
      <div class="legend" id="legend"></div>
      <div class="hover" id="hover"></div>
    </div>

    <aside class="facts" id="facts">
      <a class="back" href="./">← All parts</a>
    </aside>
  </main>

  <script type="module" src="js/part.js"></script>
</body>
</html>
