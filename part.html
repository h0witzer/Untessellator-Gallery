<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery Part · Untessellator</title>
  <link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "fflate": "https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js"
    }
  }
  </script>
</head>
<body>
  <header class="top">
    <a class="brand" href="./" aria-label="Untessellator Gallery"><i></i><span>Gallery</span></a>
    <nav>
      <a href="https://untessellator.com/">Open Untessellator</a>
      <a href="https://github.com/h0witzer/Untessellator">GitHub</a>
    </nav>
  </header>
  <div class="band" aria-hidden="true"></div>

  <main class="part">
    <div class="stage" id="stage">
      <canvas id="view" aria-label="3D view of the exported STEP, faces colored by surface type"></canvas>
      <div class="status" id="status">Loading…</div>
      <div class="tools">
        <button id="fit">Fit</button>
        <button id="edges" aria-pressed="true">Edges</button>
        <button id="mesh" aria-pressed="false">Input triangles</button>
      </div>
      <div class="legend" id="legend"></div>
      <div class="hover" id="hover"></div>
    </div>

    <aside class="facts" id="facts">
      <a class="back" href="./">← All parts</a>
    </aside>
  </main>

  <script type="module" src="js/part.js"></script>
</body>
</html>
